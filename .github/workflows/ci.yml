name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 手写模型 7.5MB 不入库，构建前先拉下来
      - name: Prepare handwriting model
        run: |
          mkdir -p packages/model
          if [ ! -f packages/model/hz.hzmodel ]; then
            curl -sSL -o packages/model/hz.hzmodel \
              https://cdn.jsdelivr.net/gh/peterolson/hanscribe@v0.1.1/test/test.hzmodel
          fi

      - run: npm run build

      - run: npm test

      - run: npm run build:playground
